name: Catalog Evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full lowercase commit SHA to evaluate
        required: true
        type: string
      operation:
        description: Evidence operation to run
        required: true
        type: choice
        options: [review, canonical]

permissions:
  contents: read

# Candidate code runs only in candidate-generation. The control-plane job receives
# its closed files through the immutable artifact service, never a shared runner.
jobs:
  candidate-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      CONTROL_SHA: ${{ github.sha }}
      OPERATION: ${{ inputs.operation }}
      RENDRO_CATALOG_BASELINE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Validate closed dispatch inputs
        shell: bash
        run: |
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${OPERATION}" == "review" || "${OPERATION}" == "canonical" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - name: Bind candidate and generate closed handoff
        shell: bash
        run: |
          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]]
          test "${OPERATION}" != canonical || test "${CANDIDATE_SHA}" = "${CONTROL_SHA}"
          jq -e '
            type == "object" and
            (keys == ["binary", "sha256", "version"]) and
            (.binary == "pdfium-webassembly-linux-amd64") and
            (.version | type == "string" and test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.sha256 | type == "string" and test("^[0-9a-f]{64}$"))
          ' priv/pdfium_pin.json >/dev/null
          expected_sha="$(jq -r '.sha256' priv/pdfium_pin.json)"
          version="$(jq -r '.version' priv/pdfium_pin.json)"
          curl -fsSL -o pdfium-cli "https://github.com/klippa-app/pdfium-cli/releases/download/${version}/pdfium-webassembly-linux-amd64"
          echo "${expected_sha}  pdfium-cli" | sha256sum --check
          chmod +x pdfium-cli
          export PATH="$PWD:$PATH"
          mix deps.get
          mkdir -p handoff
          cp priv/pdfium_pin.json handoff/pdfium_pin.json
          if [[ "${OPERATION}" == review ]]; then
            mix rendro.catalog.candidate
            # Candidate generation measures these PDFs but writes only PNGs.
            # Persist the same deterministic source bytes under the candidate's
            # ignored tmp root so the manifest hash below can bind the artifact.
            mix run -e 'targets = [{"invoice--cedar-mutual--corporate-classic--dark", "tmp/phase130-candidate/invoice/cedar-mutual/corporate-classic-dark.pdf"}, {"statement--signal-ledger--minimal-mono--dark", "tmp/phase130-candidate/statement/signal-ledger/minimal-mono-dark.pdf"}, {"payslip--northline-logistics--swiss--light", "tmp/phase130-candidate/payslip/northline-logistics/swiss-light.pdf"}, {"payslip--northline-logistics--swiss--dark", "tmp/phase130-candidate/payslip/northline-logistics/swiss-dark.pdf"}, {"ticket--aurora-live--brutalist--light", "tmp/phase130-candidate/ticket/aurora-live/brutalist-light.pdf"}, {"ticket--aurora-live--brutalist--dark", "tmp/phase130-candidate/ticket/aurora-live/brutalist-dark.pdf"}]; specs = Map.new(Rendro.Catalog.catalog_specs(), &{&1.id, &1}); Enum.each(targets, fn {id, path} -> {:ok, pdf} = Rendro.Catalog.render_source_pdf(Map.fetch!(specs, id)); :ok = File.mkdir_p(Path.dirname(path)); :ok = File.write(path, pdf) end)'
            source_root="$PWD/tmp/catalog-source-pdfs"
            manifest="tmp/phase130-candidate/candidate-manifest.json"
            target_ids=(
              "invoice--cedar-mutual--corporate-classic--dark"
              "statement--signal-ledger--minimal-mono--dark"
              "payslip--northline-logistics--swiss--light"
              "payslip--northline-logistics--swiss--dark"
              "ticket--aurora-live--brutalist--light"
              "ticket--aurora-live--brutalist--dark"
            )
            target_paths=(
              "tmp/phase130-candidate/invoice/cedar-mutual/corporate-classic-dark.pdf"
              "tmp/phase130-candidate/statement/signal-ledger/minimal-mono-dark.pdf"
              "tmp/phase130-candidate/payslip/northline-logistics/swiss-light.pdf"
              "tmp/phase130-candidate/payslip/northline-logistics/swiss-dark.pdf"
              "tmp/phase130-candidate/ticket/aurora-live/brutalist-light.pdf"
              "tmp/phase130-candidate/ticket/aurora-live/brutalist-dark.pdf"
            )
            expected_ids="$(printf '%s\n' "${target_ids[@]}" | jq -R . | jq -s .)"
            expected_cells='[]'
            for index in "${!target_ids[@]}"; do
              png_path="${target_paths[$index]%.pdf}.png"
              expected_cells="$(jq -cn --argjson cells "${expected_cells}" --arg id "${target_ids[$index]}" --arg path "${png_path}" '$cells + [{id: $id, path: $path}]')"
            done
            jq -e \
              --arg candidate "${CANDIDATE_SHA}" \
              --arg control "${CONTROL_SHA}" \
              --arg run "${GITHUB_RUN_ID}" \
              --argjson attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg renderer_version "${version}" \
              --arg renderer_sha "${expected_sha}" \
              --argjson ids "${expected_ids}" \
              --argjson expected "${expected_cells}" '
                .candidate.commit_sha == $candidate and
                .candidate.baseline_commit_sha == $control and
                .candidate.run_id == $run and
                .candidate.run_attempt == $attempt and
                .candidate.renderer.version == $renderer_version and
                .candidate.renderer.sha256 == $renderer_sha and
                (.cells | length) == 32 and
                ([.cells[].id] | unique | length) == 32 and
                .diff.changed_targets == $ids and
                ((.diff.changed_scored + .diff.changed_unscored) | sort) == ($ids | sort) and
                (.diff.byte_stable | length) == 26 and
                ((.diff.byte_stable + $ids | sort) == ([.cells[].id] | sort)) and
                ([.cells[] | select(.id as $id | $ids | index($id)) | {id, path: .png_path}] == $expected)
              ' "${manifest}" >/dev/null
            mkdir -p "${source_root}"
            source_entries='[]'
            total_bytes=0
            for index in "${!target_ids[@]}"; do
              relative_path="${target_paths[$index]}"
              source_pdf="${PWD}/${relative_path}"
              [[ -f "${source_pdf}" && ! -L "${source_pdf}" ]]
              [[ "$(head -c 5 "${source_pdf}")" == "%PDF-" ]]
              size="$(wc -c < "${source_pdf}" | tr -d ' ')"
              (( size > 0 && size <= 10485760 ))
              total_bytes=$((total_bytes + size))
              (( total_bytes <= 41943040 ))
              pdf_sha="$(sha256sum "${source_pdf}" | cut -d ' ' -f 1)"
              manifest_sha="$(jq -er --arg id "${target_ids[$index]}" '.cells[] | select(.id == $id) | .source_pdf_sha256' "${manifest}")"
              [[ "${pdf_sha}" == "${manifest_sha}" ]]
              mkdir -p "${source_root}/$(dirname "${relative_path}")"
              cp -- "${source_pdf}" "${source_root}/${relative_path}"
              entry="$(jq -cn --arg id "${target_ids[$index]}" --arg path "${relative_path}" --arg sha256 "${pdf_sha}" --argjson size "${size}" '{id: $id, path: $path, sha256: $sha256, size: $size}')"
              source_entries="$(jq -cn --argjson entries "${source_entries}" --argjson entry "${entry}" '$entries + [$entry]')"
            done
            manifest_sha="$(sha256sum "${manifest}" | cut -d ' ' -f 1)"
            jq -n \
              --arg candidate_sha "${CANDIDATE_SHA}" \
              --arg control_sha "${CONTROL_SHA}" \
              --arg checked_out_head "$(git rev-parse HEAD)" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg renderer_version "${version}" \
              --arg renderer_sha256 "${expected_sha}" \
              --arg candidate_manifest_sha256 "${manifest_sha}" \
              --argjson pdfs "${source_entries}" \
              '{schema_version: 1, candidate_sha: $candidate_sha, control_sha: $control_sha, checked_out_head: $checked_out_head, run_id: $run_id, run_attempt: $run_attempt, renderer: {version: $renderer_version, executable_sha256: $renderer_sha256}, candidate_manifest_sha256: $candidate_manifest_sha256, pdfs: $pdfs}' \
              > "${source_root}/run-metadata.json"
            test "$(find "${source_root}" -mindepth 1 \( -type l -o \( ! -type f ! -type d \) \) | wc -l | tr -d ' ')" = 0
            test "$(find "${source_root}" -type f | wc -l | tr -d ' ')" = 7
            test "$(du -sk "${source_root}" | cut -f1)" -le 40960
            export RENDRO_CATALOG_REVIEW_DIR="$PWD/tmp/catalog-evidence-review"
            mix test --include raster_snapshot test/rendro/catalog_raster_review_test.exs
            jq --slurpfile candidate tmp/phase130-candidate/candidate-manifest.json '
              {
                candidate_sha: $candidate[0].candidate.commit_sha,
                control_sha: $candidate[0].candidate.baseline_commit_sha,
                run_id: $candidate[0].candidate.run_id,
                run_attempt: $candidate[0].candidate.run_attempt,
                renderer: {
                  version: $candidate[0].candidate.renderer.version,
                  sha256: $candidate[0].candidate.renderer.sha256
                },
                images: .images
              }
            ' "${RENDRO_CATALOG_REVIEW_DIR}/final/identity-manifest.json" > handoff/final-manifest.json
            mix rendro.catalog.gallery \
              --candidate-manifest tmp/phase130-candidate/candidate-manifest.json \
              --final-manifest handoff/final-manifest.json \
              --output "$PWD/tmp/catalog-reviewer-packet"
            (
              cd "${RENDRO_CATALOG_REVIEW_DIR}/multipage"
              for name in \
                invoice-line-items-60-plus-page-first.png \
                invoice-line-items-60-plus-page-final.png \
                statement-line-items-60-plus-page-first.png \
                statement-line-items-60-plus-page-final.png
              do
                sha256sum "${name}"
              done
            ) > handoff/multipage-checksums.sha256
            export RENDRO_PRESET_RASTER_REVIEW_DIR="$PWD/tmp/rendro_preset_raster_review"
            mix test --include raster_snapshot test/rendro/theme/preset_raster_snapshot_test.exs
            jq -n --arg candidate_sha "${CANDIDATE_SHA}" --arg renderer_version "$(jq -r '.version' priv/pdfium_pin.json)" --arg renderer_sha256 "${expected_sha}" --argjson images "$(find "${RENDRO_PRESET_RASTER_REVIEW_DIR}" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort | while IFS= read -r name; do jq -n --arg id "${name%.png}" --arg path "preset-review/${name}" --arg sha256 "$(sha256sum "${RENDRO_PRESET_RASTER_REVIEW_DIR}/${name}" | cut -d ' ' -f 1)" '{id: $id, path: $path, sha256: $sha256}'; done | jq -s)" '{candidate_sha: $candidate_sha, renderer: {version: $renderer_version, sha256: $renderer_sha256}, images: $images}' > handoff/preset-review-manifest.json
            test "$(jq '.cells | length' tmp/phase130-candidate/candidate-manifest.json)" = 32
            test "$(jq '.images | length' "${RENDRO_CATALOG_REVIEW_DIR}/final/identity-manifest.json")" = 12
            test "$(wc -l < handoff/multipage-checksums.sha256 | tr -d ' ')" = 4
            test "$(jq '.images | length' handoff/preset-review-manifest.json)" = 12
            cp tmp/phase130-candidate/candidate-manifest.json handoff/candidate-manifest.json
          else
            mix rendro.catalog.gen
            mix rendro.catalog.check
            test "$(jq '.cells | length' assets/rendro/catalog.json)" = 32
            cp assets/rendro/catalog.json handoff/catalog.json
          fi
      - name: Upload isolated candidate handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendro-catalog-evidence-handoff--${{ inputs.operation }}--${{ inputs.candidate_sha }}--run-${{ github.run_id }}--attempt-${{ github.run_attempt }}
          path: handoff
          if-no-files-found: error
          retention-days: 1
      - name: Upload authority-none eight-image reviewer packet
        id: reviewer_packet_upload
        if: inputs.operation == 'review'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendro-catalog-reviewer-packet--${{ inputs.candidate_sha }}--run-${{ github.run_id }}--attempt-${{ github.run_attempt }}
          path: tmp/catalog-reviewer-packet
          if-no-files-found: error
          retention-days: 30
      - name: Upload separate source-PDF artifact
        if: inputs.operation == 'review'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rendro-catalog-source-pdfs--${{ inputs.candidate_sha }}--run-${{ github.run_id }}--attempt-${{ github.run_attempt }}
          path: tmp/catalog-source-pdfs
          if-no-files-found: error
          retention-days: 30

  catalog-evidence:
    # A dispatch from any other ref cannot select its workflow/helper as control.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: candidate-generation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTROL_REF: ${{ github.event.repository.default_branch }}
      CONTROL_SHA: ${{ github.sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      OPERATION: ${{ inputs.operation }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CONTROL_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Bind trusted control to default branch
        id: control
        shell: bash
        run: |
          [[ "${GITHUB_REF}" == "refs/heads/${CONTROL_REF}" ]]
          [[ "$(git rev-parse HEAD)" == "${CONTROL_SHA}" ]]
          printf 'sha=%s\n' "${CONTROL_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rendro-catalog-evidence-handoff--${{ inputs.operation }}--${{ inputs.candidate_sha }}--run-${{ github.run_id }}--attempt-${{ github.run_attempt }}
          path: candidate-handoff
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - name: Validate and package artifact-only candidate handoff
        shell: bash
        env:
          CONTROL_SHA: ${{ steps.control.outputs.sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "${CONTROL_SHA}" ]]
          [[ "$(find candidate-handoff -mindepth 1 -type l -o ! -type f | wc -l | tr -d ' ')" = 0 ]]
          [[ "$(find candidate-handoff -type f | wc -l | tr -d ' ')" -le 5 ]]
          [[ "$(du -sk candidate-handoff | cut -f1)" -le 20480 ]]
          actual_files="$(find candidate-handoff -type f -printf '%f\n' | sort | tr '\n' ' ')"
          if [[ "${OPERATION}" == review ]]; then
            [[ "${actual_files}" == "candidate-manifest.json final-manifest.json multipage-checksums.sha256 pdfium_pin.json preset-review-manifest.json " ]]
          else
            [[ "${actual_files}" == "catalog.json pdfium_pin.json " ]]
          fi
          cmp --silent priv/pdfium_pin.json candidate-handoff/pdfium_pin.json
          mix deps.get
          export BUNDLE_ROOT="$RUNNER_TEMP/rendro-catalog-evidence"
          mix run -e 'Code.require_file("dev/rendro/catalog_evidence_bundle.ex"); operation = String.to_existing_atom(System.fetch_env!("OPERATION")); root = "candidate-handoff"; sources = case operation do :review -> [%{role: "candidate/catalog.json", source: Path.join(root, "candidate-manifest.json"), media_type: "application/json", count: 32}, %{role: "final-review/final.json", source: Path.join(root, "final-manifest.json"), media_type: "application/json", count: 12}, %{role: "multipage-review/multipage.json", source: Path.join(root, "multipage-checksums.sha256"), media_type: "text/plain", count: 4}, %{role: "preset-review/preset.json", source: Path.join(root, "preset-review-manifest.json"), media_type: "application/json", count: 12}]; :canonical -> [%{role: "canonical/catalog.json", source: Path.join(root, "catalog.json"), media_type: "application/json", count: 32}] end; provenance = %{candidate_sha: System.fetch_env!("CANDIDATE_SHA"), checked_out_head: System.fetch_env!("CANDIDATE_SHA"), control_sha: System.fetch_env!("CONTROL_SHA"), event: "workflow_dispatch", run_id: System.fetch_env!("RUN_ID"), run_attempt: String.to_integer(System.fetch_env!("RUN_ATTEMPT")), dpi: 96}; with :ok <- Rendro.CatalogEvidenceBundle.build(operation, sources, provenance, System.fetch_env!("BUNDLE_ROOT")), :ok <- Rendro.CatalogEvidenceBundle.validate(System.fetch_env!("BUNDLE_ROOT"), operation, System.fetch_env!("CONTROL_SHA")), do: :ok, else: ({:error, reasons} -> Mix.raise("Catalog evidence bundle failed validation: #{inspect(reasons)}"))'
      - name: Upload bounded catalog evidence bundle
        id: evidence_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rendro-catalog-evidence--${{ inputs.operation }}--${{ inputs.candidate_sha }}--run-${{ github.run_id }}--attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rendro-catalog-evidence
          if-no-files-found: error
          retention-days: 30
