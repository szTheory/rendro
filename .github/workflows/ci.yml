name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        id: setup-beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Run CI
        shell: bash
        # `shell: bash` runs `bash --noprofile --norc -eo pipefail {0}`, so pipefail
        # is on by default — `mix ci`'s exit code propagates through `tee` (gate-neutral).
        # Single-line `run:` keeps the literal `run: mix ci` lane that the
        # required-checks guardrail (test/guardrails/required_checks_contract_test.exs) asserts.
        run: mix ci 2>&1 | tee /tmp/mix-ci-output.log

      - name: CI Baseline Summary
        if: always()
        continue-on-error: true
        shell: bash
        # Pass setup-beam outputs via env (values, not inlined script text) to avoid
        # ${{ }} template-expression injection into the shell (WR-01 / GitHub hardening guide).
        env:
          OTP_VERSION: ${{ steps.setup-beam.outputs.otp-version }}
          ELIXIR_VERSION: ${{ steps.setup-beam.outputs.elixir-version }}
        run: |
          {
            echo "## CI Baseline"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| OTP | ${OTP_VERSION:-n/a} |"
            echo "| Elixir | ${ELIXIR_VERSION:-n/a} |"
            echo "| Schedulers | $(elixir -e 'IO.puts(System.schedulers_online())' 2>/dev/null || echo 'n/a') |"
            # TODO(109): replace 'cold / none' with cache-hit output once actions/cache + id: cache lands
            echo "| Cache (deps) | cold / none |"
            echo "| Cache (_build) | cold / none |"
            echo ""
            echo "### Slowest Tests"
            echo ""
            grep -A 25 'Top [0-9]* slowest' /tmp/mix-ci-output.log || echo "_(slowest data unavailable)_"
          } >> "$GITHUB_STEP_SUMMARY"

  example-phoenix:
    runs-on: ubuntu-latest
    # no `needs:` -> graph-disconnected (D-09); no continue-on-error (D-10)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Run example app tests
        working-directory: examples/phoenix_example
        run: |
          mix deps.get
          mix test

  raster-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    # no 'needs:' -> graph-disconnected; continue-on-error: true -> download failure cannot block engine merges (RAST-02)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install pdfium-cli (pinned)
        run: |
          EXPECTED_SHA256="b1e7f3dd8d6c77e0eb8e67c6a33de4efa5de9f38d87263c151acb88994ae160a"
          curl -fsSL -o pdfium-cli \
            "https://github.com/klippa-app/pdfium-cli/releases/download/v0.11.0/pdfium-webassembly-linux-amd64"
          echo "${EXPECTED_SHA256}  pdfium-cli" | sha256sum --check
          chmod +x pdfium-cli
          sudo mv pdfium-cli /usr/local/bin/pdfium-cli

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Run Raster Snapshot Tests
        env:
          MIX_RASTER_BLESS: "false"
        run: mix test --include raster_snapshot test/rendro/adapters/pdfium_raster_snapshot_test.exs

      - name: Check Launch Artifacts
        run: mix rendro.launch_artifacts.check

  comparison-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    # no 'needs:' -> graph-disconnected; committed benchmark truth only, no external benchmark rerun
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Check Comparison Evidence
        run: mix rendro.comparison.check

  livebook-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    # no 'needs:' -> graph-disconnected; notebook check does not start a Livebook server
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Check Livebook Tutorial
        run: mix rendro.livebook.check

  pdfjs-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    # no 'needs:' -> graph-disconnected; npm/PDF.js failures cannot block engine merges
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: scripts/pdfjs_observer/package-lock.json

      - name: Install PDF.js observer dependencies
        working-directory: scripts/pdfjs_observer
        run: npm ci

      - name: Check PDF.js advisory observations
        run: node scripts/pdfjs_observer/observe.mjs --check

  viewer-evidence-live-proof:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install pdfium-cli
        run: |
          curl -fsSL -o pdfium-cli "https://github.com/klippa-app/pdfium-cli/releases/download/v0.10.3/pdfium-webassembly-linux-amd64"
          chmod +x pdfium-cli
          sudo mv pdfium-cli /usr/local/bin/pdfium-cli
          pdfium-cli --version

      - name: Install pdfinfo, qpdf, and pdfsig
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          pdfinfo -v
          qpdf --version
          pdfsig -v

      - name: Setup Python for pyhanko
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install pyhanko-cli
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyHanko pyHanko-cli
          pyhanko --version

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Run Viewer Evidence Live Proof
        run: |
          mix test --include live_pdf_tools \
            test/rendro/adapters/forms_viewer_evidence_live_test.exs \
            test/rendro/adapters/embedded_files_viewer_evidence_live_test.exs \
            test/rendro/adapters/links_viewer_evidence_live_test.exs \
            test/rendro/adapters/protection_viewer_evidence_live_test.exs \
            test/rendro/adapters/signature_widget_viewer_evidence_live_test.exs \
            test/rendro/adapters/signed_artifact_viewer_evidence_live_test.exs \
            test/rendro/adapters/trust_sensitive_viewer_evidence_live_test.exs

  signing-live-proof:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Signing Proof Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfsig -v
          python3 -m pip install --upgrade pip
          python3 -m pip install pyHanko pyHanko-cli
          pyhanko --version

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Run Signing Live Proof
        run: mix test --include live_signing test/rendro/adapters/signing_live_test.exs

  long-lived-live-proof:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install Signing Proof Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfsig -v
          python3 -m pip install --upgrade pip
          python3 -m pip install 'certomancer[web-api]' pyHanko pyHanko-cli
          certomancer --version
          pyhanko --version

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Run Long-Lived Live Proof
        run: mix test --include live_pdf_tools test/rendro/adapters/signing_live_test.exs

  release-proof:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Verify Release Proof
        run: mix run scripts/release_preflight_proof.exs --current-version-tag --worktree "$RUNNER_TEMP/rendro-release-proof"
