name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '28'
            elixir: '1.19.5'
            primary: true
          - otp: '26'
            elixir: '1.19.0'
            primary: false
    env:
      # Bumping CACHE_BUSTER bursts the cache across all jobs
      CACHE_BUSTER: v1
      MIX_ENV: test

    steps:
      - name: Checkout
        if: github.event_name != 'pull_request' || matrix.primary == true
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        if: github.event_name != 'pull_request' || matrix.primary == true
        id: setup-beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache dependencies
        if: github.event_name != 'pull_request' || matrix.primary == true
        id: deps-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: deps
          key: ${{ runner.os }}-deps-${{ env.CACHE_BUSTER }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ env.CACHE_BUSTER }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-

      - name: Cache build artifacts
        if: github.event_name != 'pull_request' || matrix.primary == true
        id: build-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ env.CACHE_BUSTER }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.CACHE_BUSTER }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-

      - name: Install Dependencies
        if: github.event_name != 'pull_request' || matrix.primary == true
        run: mix deps.get

      - name: Ensure PLT directory exists
        if: github.event_name != 'pull_request' || matrix.primary == true
        run: mkdir -p priv/plts

      - name: Cache PLT
        if: github.event_name != 'pull_request' || matrix.primary == true
        id: plt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ env.CACHE_BUSTER }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.CACHE_BUSTER }}-${{ steps.setup-beam.outputs.otp-version }}-${{ steps.setup-beam.outputs.elixir-version }}-${{ env.MIX_ENV }}-

      - name: Format
        if: matrix.primary == true
        run: mix format --check-formatted

      - name: Hex Build
        if: matrix.primary == true
        run: mix hex.build

      - name: Compile
        if: matrix.primary == true
        run: mix compile --warnings-as-errors

      - name: Test
        if: matrix.primary == true
        shell: bash
        run: mix test --exclude quarantine --slowest 10 2>&1 | tee /tmp/mix-test-output.log

      - name: Docs
        if: matrix.primary == true
        run: mix docs --warnings-as-errors

      - name: Credo
        if: matrix.primary == true
        run: mix credo --strict

      - name: Dialyzer
        if: matrix.primary == true
        run: mix dialyzer

      - name: Run Tests (Secondary Version)
        if: github.event_name != 'pull_request' && matrix.primary == false
        shell: bash
        run: mix test --exclude quarantine --slowest 10 2>&1 | tee /tmp/mix-test-output.log

      - name: Save PLT Cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: always() && (github.event_name != 'pull_request' || matrix.primary == true) && steps.plt-cache.outputs.cache-hit != 'true'
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - name: CI Baseline Summary
        if: always() && (github.event_name != 'pull_request' || matrix.primary == true)
        continue-on-error: true
        shell: bash
        # Pass setup-beam outputs via env (values, not inlined script text) to avoid
        # ${{ }} template-expression injection into the shell (WR-01 / GitHub hardening guide).
        env:
          OTP_VERSION: ${{ steps.setup-beam.outputs.otp-version }}
          ELIXIR_VERSION: ${{ steps.setup-beam.outputs.elixir-version }}
          DEPS_CACHE_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          PLT_CACHE_HIT: ${{ steps.plt-cache.outputs.cache-hit }}
        run: |
          [ "$DEPS_CACHE_HIT" = "true" ] && D_STATUS="hit" || D_STATUS="miss"
          [ "$BUILD_CACHE_HIT" = "true" ] && B_STATUS="hit" || B_STATUS="miss"
          [ "$PLT_CACHE_HIT" = "true" ] && P_STATUS="hit" || P_STATUS="miss"
          {
            echo "## CI Baseline"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| OTP | ${OTP_VERSION:-n/a} |"
            echo "| Elixir | ${ELIXIR_VERSION:-n/a} |"
            echo "| Schedulers | $(elixir -e 'IO.puts(System.schedulers_online())' 2>/dev/null || echo 'n/a') |"
            echo "| Cache (deps) | ${D_STATUS} |"
            echo "| Cache (_build) | ${B_STATUS} |"
            echo "| Cache (PLT) | ${P_STATUS} |"
            echo ""
            echo "### Slowest Tests"
            echo ""
            grep -A 25 'Top [0-9]* slowest' /tmp/mix-test-output.log || echo "_(slowest data unavailable)_"
          } >> "$GITHUB_STEP_SUMMARY"

  example-phoenix:
    runs-on: ubuntu-latest
    # no `needs:` -> graph-disconnected (D-09); no continue-on-error (D-10)
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Run example app tests
        working-directory: examples/phoenix_example
        run: |
          mix deps.get
          mix test

  configurator-browser:
    # no `needs:` -> graph-disconnected required static-browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: scripts/configurator_e2e/package-lock.json

      - name: Install locked browser test dependencies
        run: npm ci --prefix scripts/configurator_e2e

      - name: Run pinned Chromium configurator suite
        run: npm test --prefix scripts/configurator_e2e

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: configurator-browser-evidence
          path: |
            scripts/configurator_e2e/test-results
            scripts/configurator_e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  advisory-checks:
    runs-on: ubuntu-latest
    # no 'needs:' -> graph-disconnected; only the legacy adapter comparison is advisory
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: scripts/pdfjs_observer/package-lock.json

      - name: Install pdfium-cli (pinned)
        run: |
          EXPECTED_SHA256="b1e7f3dd8d6c77e0eb8e67c6a33de4efa5de9f38d87263c151acb88994ae160a"
          curl -fsSL -o pdfium-cli \
            "https://github.com/klippa-app/pdfium-cli/releases/download/v0.11.0/pdfium-webassembly-linux-amd64"
          echo "${EXPECTED_SHA256}  pdfium-cli" | sha256sum --check
          chmod +x pdfium-cli
          sudo mv pdfium-cli /usr/local/bin/pdfium-cli

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Run Raster Snapshot Tests
        continue-on-error: true
        env:
          MIX_RASTER_BLESS: "false"
        run: mix test --include raster_snapshot test/rendro/adapters/pdfium_raster_snapshot_test.exs

      - name: Run Preset Raster Snapshot Tests
        env:
          MIX_RASTER_BLESS: "false"
        run: mix test --include raster_snapshot test/rendro/theme/preset_raster_snapshot_test.exs


      - name: Check Launch Artifacts
        run: mix rendro.launch_artifacts.check

      - name: Check Catalog Artifacts
        run: mix rendro.catalog.check

      - name: Check Comparison Evidence
        run: mix rendro.comparison.check

      - name: Check Livebook Tutorial
        run: mix rendro.livebook.check

      - name: Install PDF.js observer dependencies
        working-directory: scripts/pdfjs_observer
        run: npm ci

      - name: Check PDF.js advisory observations
        run: node scripts/pdfjs_observer/observe.mjs --check

  integration-proofs:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf
          pdfinfo -v
          qpdf --version
          pdfsig -v

      - name: Install pdfium-cli (pinned)
        run: |
          EXPECTED_SHA256="b1e7f3dd8d6c77e0eb8e67c6a33de4efa5de9f38d87263c151acb88994ae160a"
          curl -fsSL -o pdfium-cli \
            "https://github.com/klippa-app/pdfium-cli/releases/download/v0.11.0/pdfium-webassembly-linux-amd64"
          echo "${EXPECTED_SHA256}  pdfium-cli" | sha256sum --check
          chmod +x pdfium-cli
          sudo mv pdfium-cli /usr/local/bin/pdfium-cli
          pdfium-cli --version

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --require-hashes -r scripts/proof_requirements.txt
          certomancer --version
          pyhanko --version

      - name: Install Elixir Dependencies
        run: mix deps.get

      - name: Run Viewer Evidence Live Proof
        run: |
          mix test --include live_pdf_tools \
            test/rendro/adapters/forms_viewer_evidence_live_test.exs \
            test/rendro/adapters/embedded_files_viewer_evidence_live_test.exs \
            test/rendro/adapters/links_viewer_evidence_live_test.exs \
            test/rendro/adapters/protection_viewer_evidence_live_test.exs \
            test/rendro/adapters/signature_widget_viewer_evidence_live_test.exs \
            test/rendro/adapters/signed_artifact_viewer_evidence_live_test.exs \
            test/rendro/adapters/trust_sensitive_viewer_evidence_live_test.exs

      - name: Run Signing Live Proof
        run: mix test --include live_signing test/rendro/adapters/signing_live_test.exs

      - name: Run Long-Lived Live Proof
        run: mix test --include live_pdf_tools test/rendro/adapters/signing_live_test.exs

      - name: Verify Release Proof
        run: mix run scripts/release_preflight_proof.exs --current-version-tag --skip-ci --skip-security-audits --worktree "$RUNNER_TEMP/rendro-release-proof"

  security-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Mix Deps Audit
        run: mix deps.audit

      - name: Mix Hex Audit
        run: mix hex.audit

  quality-governance:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.14.0'

      - name: Install Dependencies
        run: mix deps.get

      - name: Run quality governance
        run: mix quality.governance

  ci-success:
    if: always()
    needs: [test, configurator-browser, integration-proofs, quality-governance]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce strict checks
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Pass
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: exit 0
