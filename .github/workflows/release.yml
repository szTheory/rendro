name: Release to Hex

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-and-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Dependencies
        run: mix deps.get

      - name: Verify Version Match
        run: |
          VERSION_DECLARATIONS=$(sed -nE 's/^[[:space:]]*@version[[:space:]]+"([^"]+)"[[:space:]]*$/\1/p' mix.exs)
          VERSION_DECLARATION_COUNT=$(printf '%s\n' "$VERSION_DECLARATIONS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERSION_DECLARATION_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one top-level @version declaration in mix.exs; found $VERSION_DECLARATION_COUNT"
            exit 1
          fi
          MIX_VERSION=$VERSION_DECLARATIONS
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$MIX_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: mix.exs has $MIX_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Run CI Checks
        run: mix ci

      - name: Run Release Preflight
        run: mix release.preflight

  publish:
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: 'Hex Publish'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
