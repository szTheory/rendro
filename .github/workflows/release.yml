name: Release to Hex

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-and-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Dependencies
        run: mix deps.get

      - name: Verify Version Match
        run: |
          MIX_VERSION=$(grep '@version' mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$MIX_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: mix.exs has $MIX_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Run CI Checks
        run: mix ci

      - name: Run Release Preflight
        run: mix release.preflight

      - name: Publish to Hex (Dry Run)
        run: mix hex.publish --dry-run

  publish:
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    environment: 'Hex Publish'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
