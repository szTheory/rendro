name: Release to Hex

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-and-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Dependencies
        run: mix deps.get

      - name: Verify Version Match
        run: |
          VERSION_DECLARATIONS=$(sed -nE 's/^[[:space:]]*@version[[:space:]]+"([^"]+)"[[:space:]]*$/\1/p' mix.exs)
          VERSION_DECLARATION_COUNT=$(printf '%s\n' "$VERSION_DECLARATIONS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERSION_DECLARATION_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one top-level @version declaration in mix.exs; found $VERSION_DECLARATION_COUNT"
            exit 1
          fi
          MIX_VERSION=$VERSION_DECLARATIONS
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$MIX_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: mix.exs has $MIX_VERSION but tag is $TAG_VERSION"
            exit 1
          fi

      - name: Run CI Checks
        run: mix ci

      - name: Verify Repository Hygiene
        run: mix quality.hygiene

      - name: Run Release Preflight
        run: mix release.preflight

  publish:
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: 'Hex Publish'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        # Hex publishes docs by default. Keep future tag releases package-only:
        # the candidate-bound HexDocs workflow owns the separately approved docs publish.
        run: mix hex.publish --yes --no-docs

  phoenix-clean-room-advisory:
    # This is an external, advisory proof lane. It intentionally does not become a
    # required release check, but the job itself fails unless it writes fresh success evidence.
    needs: publish
    if: always() && needs.publish.result == 'success' && github.ref_name == 'v1.3.4'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Run advisory Phoenix clean-room proof
        env:
          PROOF_ROOT: /tmp/rendro-phoenix-clean-room-${{ github.run_id }}-${{ github.run_attempt }}
          PROOF_OUTPUT: ${{ runner.temp }}/phoenix-clean-room-proof.json
        run: |
          set -euo pipefail
          mix run scripts/phoenix_clean_room_proof.exs -- \
            --root "$PROOF_ROOT" \
            --output "$PROOF_OUTPUT"
          node -e '
            const fs = require("fs");
            const proof = JSON.parse(fs.readFileSync(process.env.PROOF_OUTPUT, "utf8"));
            if (proof.outcome !== "success" || proof.cleanup !== "workspace_removed" || proof.lane !== "advisory_external_evidence") process.exit(1);
          '

      - name: Upload advisory Phoenix clean-room evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phoenix-clean-room-advisory
          path: ${{ runner.temp }}/phoenix-clean-room-proof.json
          if-no-files-found: error
          retention-days: 14
