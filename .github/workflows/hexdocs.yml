name: HexDocs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_commit_sha:
        description: Exact approved candidate commit SHA
        required: true
        type: string
      release_ref:
        description: Exact approved release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hexdocs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-docs-ready:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify sealed release identity
        run: |
          set -euo pipefail
          APPROVED_CANDIDATE_SHA="f03c78bab54efe1cd1596d51cf3f28193232e2a3"
          APPROVED_RELEASE_REF="v1.3.4"
          git fetch --force origin "refs/tags/${APPROVED_RELEASE_REF}:refs/tags/${APPROVED_RELEASE_REF}"
          TAG_OBJECT_TYPE=$(git cat-file -t "${APPROVED_RELEASE_REF}")
          test "$TAG_OBJECT_TYPE" = tag
          PEELED_TAG_SHA=$(git rev-parse "${APPROVED_RELEASE_REF}^{}")
          test "$PEELED_TAG_SHA" = "$APPROVED_CANDIDATE_SHA"

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Verify Docs Contract
        run: mix docs.contract

      - name: Verify Livebook Tutorial
        run: mix rendro.livebook.check

      - name: Verify Comparison Evidence
        run: mix rendro.comparison.check

      - name: Build Hex Package
        run: mix hex.build

      - name: Build Docs
        run: mix docs

      - name: Check Public URL Verifier Syntax
        run: bash -n scripts/verify_public_launch_urls.sh

  publish-hexdocs:
    runs-on: ubuntu-latest
    needs: verify-docs-ready
    # Environment secrets are reachable only from the protected main control ref.
    # The separately checked-out release artifact remains bound below.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: 'Hex Publish'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # The dispatch ref is the trusted control plane for this workflow.
          # The approved release artifact is checked out below after its identity is verified.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify approved candidate identity
        env:
          INPUT_CANDIDATE_COMMIT_SHA: ${{ inputs.candidate_commit_sha }}
          INPUT_RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          APPROVED_CANDIDATE_SHA="f03c78bab54efe1cd1596d51cf3f28193232e2a3"
          APPROVED_RELEASE_REF="v1.3.4"
          git fetch --force origin "refs/tags/${APPROVED_RELEASE_REF}:refs/tags/${APPROVED_RELEASE_REF}"
          PEELED_TAG_SHA=$(git rev-parse "${APPROVED_RELEASE_REF}^{}")
          test "$INPUT_CANDIDATE_COMMIT_SHA" = "$APPROVED_CANDIDATE_SHA"
          test "$INPUT_RELEASE_REF" = "$APPROVED_RELEASE_REF"
          test "$PEELED_TAG_SHA" = "$APPROVED_CANDIDATE_SHA"
          git checkout --detach "$APPROVED_CANDIDATE_SHA"
          ARTIFACT_HEAD=$(git rev-parse HEAD)
          test "$ARTIFACT_HEAD" = "$APPROVED_CANDIDATE_SHA"
          VERSION_DECLARATIONS=$(sed -nE 's/^[[:space:]]*@version[[:space:]]+"([^"]+)"[[:space:]]*$/\1/p' mix.exs)
          VERSION_DECLARATION_COUNT=$(printf '%s\n' "$VERSION_DECLARATIONS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERSION_DECLARATION_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one top-level @version declaration in mix.exs; found $VERSION_DECLARATION_COUNT"
            exit 1
          fi
          MIX_VERSION=$VERSION_DECLARATIONS
          test "$MIX_VERSION" = "${APPROVED_RELEASE_REF#v}"

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Validate Hex Publish Secret
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "::error::HEX_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Publish HexDocs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

      - name: Record candidate binding provenance
        env:
          CONTROL_REF: ${{ github.ref }}
          CONTROL_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_commit_sha }}
          RELEASE_REF: ${{ inputs.release_ref }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          PEELED_TAG_SHA=$(git rev-parse "${RELEASE_REF}^{}")
          ARTIFACT_HEAD=$(git rev-parse HEAD)
          test "$CANDIDATE_SHA" = "$PEELED_TAG_SHA"
          test "$CANDIDATE_SHA" = "$ARTIFACT_HEAD"
          export PEELED_TAG_SHA ARTIFACT_HEAD
          node -e 'const fs = require("fs"); const evidence = {control_ref: process.env.CONTROL_REF, control_sha: process.env.CONTROL_SHA, requested_artifact_sha: process.env.CANDIDATE_SHA, peeled_tag_sha: process.env.PEELED_TAG_SHA, detached_artifact_head: process.env.ARTIFACT_HEAD, tag: process.env.RELEASE_REF, workflow_name: "HexDocs", workflow_event: "workflow_dispatch", workflow_run_id: process.env.WORKFLOW_RUN_ID}; fs.writeFileSync("hexdocs-candidate-binding.json", JSON.stringify(evidence) + "\\n");'

      - name: Upload candidate binding provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hexdocs-candidate-binding
          path: hexdocs-candidate-binding.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify Public Launch URLs
        run: scripts/verify_public_launch_urls.sh
