name: HexDocs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      candidate_commit_sha:
        description: Exact approved candidate commit SHA
        required: true
        type: string
      release_ref:
        description: Exact approved release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hexdocs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-docs-ready:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Verify Docs Contract
        run: mix docs.contract

      - name: Verify Livebook Tutorial
        run: mix rendro.livebook.check

      - name: Verify Comparison Evidence
        run: mix rendro.comparison.check

      - name: Build Hex Package
        run: mix hex.build

      - name: Build Docs
        run: mix docs

      - name: Check Public URL Verifier Syntax
        run: bash -n scripts/verify_public_launch_urls.sh

  publish-hexdocs:
    runs-on: ubuntu-latest
    needs: verify-docs-ready
    if: github.event_name == 'workflow_dispatch' && inputs.release_ref == 'v1.3.3' && inputs.candidate_commit_sha == github.sha
    environment: 'Hex Publish'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.candidate_commit_sha }}

      - name: Verify approved candidate identity
        run: |
          test "${{ inputs.candidate_commit_sha }}" = "$GITHUB_SHA"
          test "${{ inputs.release_ref }}" = "v1.3.3"
          VERSION_DECLARATIONS=$(sed -nE 's/^[[:space:]]*@version[[:space:]]+"([^"]+)"[[:space:]]*$/\1/p' mix.exs)
          VERSION_DECLARATION_COUNT=$(printf '%s\n' "$VERSION_DECLARATIONS" | sed '/^$/d' | wc -l | tr -d ' ')
          if [ "$VERSION_DECLARATION_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly one top-level @version declaration in mix.exs; found $VERSION_DECLARATION_COUNT"
            exit 1
          fi
          MIX_VERSION=$VERSION_DECLARATIONS
          test "$MIX_VERSION" = "1.3.3"

      - name: Setup Beam
        uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Install Dependencies
        run: mix deps.get

      - name: Validate Hex Publish Secret
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "::error::HEX_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Publish HexDocs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

      - name: Verify Public Launch URLs
        run: scripts/verify_public_launch_urls.sh
