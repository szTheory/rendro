<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 80" role="img" aria-labelledby="t d" width="352" height="80">
  <title id="t">RENDRO</title>
  <desc id="d">Frame-R exploration A3 — pixel take: wider structural seams and stair-stepped diagonals (the R leg and N diagonal are quantised to a grid).</desc>
  <style>
    svg { color: #101827; } .accent { fill: #2C6BED; }
    @media (prefers-color-scheme: dark) { svg { color: #F2ECE0; } .accent { fill: #7FA9FF; } }
  </style>
  <g fill="currentColor">
    <!-- R: stair-stepped leg -->
    <g transform="translate(10,12)">
      <rect x="0" y="0" width="11" height="56"/>
      <path d="M15 0 H35 L46 11 H15 Z"/>
      <rect x="35" y="15" width="11" height="13"/>
      <rect x="15" y="28" width="31" height="11"/>
      <rect x="15" y="41" width="9" height="9"/>
      <rect x="26" y="47" width="9" height="9"/>
      <rect x="37" y="53" width="9" height="9"/>
      <path class="accent" d="M35 0 L46 11 H35 Z"/>
    </g>
    <!-- E -->
    <g transform="translate(68,12)">
      <rect x="0" y="0" width="11" height="56"/>
      <rect x="15" y="0" width="27" height="11"/>
      <rect x="15" y="22.5" width="21" height="11"/>
      <rect x="15" y="45" width="27" height="11"/>
    </g>
    <!-- N: stair-stepped diagonal -->
    <g transform="translate(122,12)">
      <rect x="0" y="0" width="11" height="56"/>
      <rect x="33" y="0" width="11" height="56"/>
      <rect x="15" y="2" width="9" height="11"/>
      <rect x="20" y="15" width="9" height="11"/>
      <rect x="25" y="28" width="9" height="11"/>
      <rect x="30" y="41" width="9" height="11"/>
    </g>
    <!-- D -->
    <g transform="translate(178,12)">
      <rect x="0" y="0" width="11" height="56"/>
      <rect x="15" y="0" width="31" height="11"/>
      <rect x="35" y="15" width="11" height="26"/>
      <rect x="15" y="45" width="31" height="11"/>
    </g>
    <!-- R -->
    <g transform="translate(236,12)">
      <rect x="0" y="0" width="11" height="56"/>
      <path d="M15 0 H35 L46 11 H15 Z"/>
      <rect x="35" y="15" width="11" height="13"/>
      <rect x="15" y="28" width="31" height="11"/>
      <rect x="15" y="41" width="9" height="9"/>
      <rect x="26" y="47" width="9" height="9"/>
      <rect x="37" y="53" width="9" height="9"/>
    </g>
    <!-- O (rounded ring) -->
    <g transform="translate(294,12)">
      <path fill-rule="evenodd" d="M14 0 H34 A14 14 0 0 1 48 14 V42 A14 14 0 0 1 34 56 H14 A14 14 0 0 1 0 42 V14 A14 14 0 0 1 14 0 Z M19.5 13.5 H28.5 A6 6 0 0 1 34.5 19.5 V36.5 A6 6 0 0 1 28.5 42.5 H19.5 A6 6 0 0 1 13.5 36.5 V19.5 A6 6 0 0 1 19.5 13.5 Z"/>
    </g>
  </g>
</svg>
