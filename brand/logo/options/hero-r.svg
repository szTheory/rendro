<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 80" role="img" aria-labelledby="t d" width="58" height="80">
  <title id="t">Rendro mark</title>
  <desc id="d">Hero R — page-frame bowl with a folded corner and a single structural seam in the stem (the digital detail, concentrated in the R).</desc>
  <style>
    svg { color: #101827; } .accent { fill: #2C6BED; }
    @media (prefers-color-scheme: dark) { svg { color: #F2ECE0; } .accent { fill: #7FA9FF; } }
  </style>
  <g fill="currentColor" transform="translate(6,12)">
    <!-- stem, split by a structural seam (the digital line) -->
    <rect x="0" y="0" width="11" height="33.5"/>
    <rect x="0" y="36" width="11" height="20"/>
    <!-- page-frame bowl with folded corner -->
    <path d="M13.5 0 H35 L46 11 H13.5 Z"/>
    <rect x="35" y="13.5" width="11" height="14.5"/>
    <rect x="13.5" y="28" width="32.5" height="11"/>
    <!-- leg -->
    <path d="M13.5 41.5 H24.5 L46 56 H35 Z"/>
  </g>
  <path class="accent" transform="translate(6,12)" d="M35 0 L46 11 H35 Z"/>
</svg>
