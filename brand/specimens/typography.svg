<svg xmlns="http://www.w3.org/2000/svg" width="920" height="680" viewBox="0 0 920 680" role="img" aria-label="Rendro typography specimen">
  <style>
    .sans{font-family:Inter,system-ui,-apple-system,sans-serif;}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
    .label{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;fill:#5B6573;}
    .stepname{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;fill:#101827;font-weight:500;}
  </style>
  <rect width="920" height="680" fill="#F7F3EA"/>
  <text class="sans" x="40" y="48" font-size="26" font-weight="700" fill="#101827">Rendro — Type</text>
  <text class="sans" x="40" y="70" font-size="13" fill="#5B6573">Inter for UI · JetBrains Mono for code. Scale below shows real size / line / weight.</text>
  <line x1="40" y1="86" x2="880" y2="86" stroke="#D8D2C3"/>

  <!-- left gutter for labels at x=40; samples start at x=200 -->

  <!-- display-xl 56/64 700 -->
  <text class="stepname" x="40" y="138">display-xl</text>
  <text class="label" x="40" y="154">56/64 · 700</text>
  <text class="sans" x="200" y="150" font-size="56" font-weight="700" fill="#101827">Render the document.</text>

  <!-- display-l 44/52 700 -->
  <text class="stepname" x="40" y="214">display-l</text>
  <text class="label" x="40" y="230">44/52 · 700</text>
  <text class="sans" x="200" y="224" font-size="44" font-weight="700" fill="#101827">Render the document.</text>

  <!-- h1 36/44 700 -->
  <text class="stepname" x="40" y="282">h1</text>
  <text class="label" x="40" y="298">36/44 · 700</text>
  <text class="sans" x="200" y="292" font-size="36" font-weight="700" fill="#101827">Respect the system.</text>

  <!-- h2 28/36 600 -->
  <text class="stepname" x="40" y="342">h2</text>
  <text class="label" x="40" y="358">28/36 · 600</text>
  <text class="sans" x="200" y="350" font-size="28" font-weight="600" fill="#101827">Respect the system.</text>

  <!-- h3 22/30 600 -->
  <text class="stepname" x="40" y="396">h3</text>
  <text class="label" x="40" y="412">22/30 · 600</text>
  <text class="sans" x="200" y="404" font-size="22" font-weight="600" fill="#101827">Render the document. Respect the system.</text>

  <line x1="40" y1="436" x2="880" y2="436" stroke="#D8D2C3"/>

  <!-- body-l 18/30 400 -->
  <text class="stepname" x="40" y="470">body-l</text>
  <text class="label" x="40" y="486">18/30 · 400</text>
  <text class="sans" x="200" y="478" font-size="18" font-weight="400" fill="#1F2937">Render the document. Respect the system. The quick brown fox.</text>

  <!-- body 16/26 400 -->
  <text class="stepname" x="40" y="514">body</text>
  <text class="label" x="40" y="530">16/26 · 400</text>
  <text class="sans" x="200" y="522" font-size="16" font-weight="400" fill="#1F2937">Render the document. Respect the system. The quick brown fox jumps.</text>

  <!-- body-s 14/22 400 -->
  <text class="stepname" x="40" y="554">body-s</text>
  <text class="label" x="40" y="570">14/22 · 400</text>
  <text class="sans" x="200" y="562" font-size="14" font-weight="400" fill="#1F2937">Render the document. Respect the system. The quick brown fox jumps over.</text>

  <!-- caption 12/18 500 -->
  <text class="stepname" x="40" y="592">caption</text>
  <text class="label" x="40" y="608">12/18 · 500</text>
  <text class="sans" x="200" y="600" font-size="12" font-weight="500" fill="#5B6573">RENDER THE DOCUMENT · RESPECT THE SYSTEM · CAPTION TEXT</text>

  <line x1="40" y1="624" x2="880" y2="624" stroke="#D8D2C3"/>

  <!-- code 14/22 400 -->
  <text class="stepname" x="40" y="656">code</text>
  <text class="label" x="40" y="672">14/22 · 400 · mono</text>
  <rect x="200" y="640" width="240" height="28" rx="6" fill="#EDE4D3"/>
  <text class="mono" x="212" y="659" font-size="14" font-weight="400" fill="#101827">Rendro.render(doc)</text>
</svg>
